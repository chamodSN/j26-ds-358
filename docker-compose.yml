# Start the app:            docker compose up --build
# Start app + team modules: docker compose --profile modules up --build
name: vero

x-module: &module
  restart: unless-stopped
  env_file: [ .env ]
  networks: [ vero-net ]
  profiles: [ "modules" ]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vero}
      POSTGRES_DB: ${POSTGRES_DB:-vero}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vero} -d ${POSTGRES_DB:-vero}" ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [ vero-net ]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [ vero-net ]

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: [ .env ]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vero}:${POSTGRES_PASSWORD:-vero}@db:5432/${POSTGRES_DB:-vero}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Live reload for development. Remove "volumes" and "command" when you deploy.
    volumes:
      - ./backend:/srv/backend
      - ./shared:/srv/shared
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    networks: [ vero-net ]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks: [ vero-net ]

  # ---------------- Team modules (profile: modules) ----------------
  member1-retrieval:
    <<: *module
    build:
      context: .
      dockerfile: docker/module.Dockerfile
      args:
        MODULE_DIR: member1_retrieval
        MODULE_APP: member1_retrieval.api:app
        PORT: "8001"
    ports: [ "8001:8001" ]
    volumes:
      - ./member1_retrieval:/srv/member1_retrieval
      - ./shared:/srv/shared
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  member2-entity:
    <<: *module
    build:
      context: .
      dockerfile: docker/module.Dockerfile
      args:
        MODULE_DIR: member2_entity_resolution
        MODULE_APP: member2_entity_resolution.api:app
        PORT: "8002"
    ports: [ "8002:8002" ]
    volumes:
      - ./member2_entity_resolution:/srv/member2_entity_resolution
      - ./shared:/srv/shared
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  member3-kg:
    <<: *module
    build:
      context: .
      dockerfile: docker/module.Dockerfile
      args:
        MODULE_DIR: member3_knowledge_graph
        MODULE_APP: member3_knowledge_graph.api:app
        PORT: "8003"
    ports: [ "8003:8003" ]
    volumes:
      - ./member3_knowledge_graph:/srv/member3_knowledge_graph
      - ./shared:/srv/shared
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  member4-reranking:
    <<: *module
    build:
      context: .
      dockerfile: docker/module.Dockerfile
      args:
        MODULE_DIR: member4_reranking
        MODULE_APP: member4_reranking.api:app
        PORT: "8004"
    ports: [ "8004:8004" ]
    volumes:
      - ./member4_reranking:/srv/member4_reranking
      - ./shared:/srv/shared
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  vero-net:
    driver: bridge

volumes:
  pgdata:
